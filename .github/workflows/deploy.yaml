name: Deploy to EC2

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-079d51280d1964117" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ssm-user/unifesto/app && git pull origin main && npm ci --omit=dev && npx prisma generate && npm run build && pm2 restart unifesto && pm2 save"]}' \
            --region ap-south-1 \
            --query "Command.CommandId" \
            --output text)
          
          echo "SSM Command ID: $COMMAND_ID"
          
          # Wait for command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-079d51280d1964117" \
            --region ap-south-1
          
          # Get output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-079d51280d1964117" \
            --region ap-south-1 \
            --query "StandardOutputContent" \
            --output text